<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Classroom Monitor{% endblock %}</title>
<script src="/static/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-border: #262b35;
    --fg: #e7e9ee;
    --muted: #8a90a0;
    --accent: #4f8cff;
    --good: #35c07c;
    --warn: #e0a738;
    --bad: #e2574c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  nav {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--panel-border);
    background: var(--panel);
  }
  nav .brand { font-weight: 700; letter-spacing: -0.01em; margin-right: auto; }
  nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
    padding: 6px 10px;
    border-radius: 6px;
  }
  nav a.active, nav a:hover { color: var(--fg); background: #1f2430; }

  main { padding: 24px; max-width: 1200px; margin: 0 auto; }

  .grid { display: grid; gap: 16px; }
  .cards { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .card h3 {
    margin: 0 0 6px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 600;
  }
  .card .value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .panel { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 18px; }
  .panel h2 { margin: 0 0 14px; font-size: 15px; }

  select, button {
    background: #1f2430;
    color: var(--fg);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }
  button.danger  { background: var(--bad); border-color: var(--bad); color: white; font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--panel-border); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  tr:last-child td { border-bottom: none; }

  .pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .pill.entry { background: rgba(53,192,124,0.15); color: var(--good); }
  .pill.exit  { background: rgba(226,87,76,0.15); color: var(--bad); }

  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .status-live  { background: var(--good); }
  .status-off   { background: var(--muted); }

  .empty { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
</style>
</head>
<body>
<nav>
  <span class="brand">Classroom Monitor</span>
  <a href="/live" class="{{ 'active' if active=='live' else '' }}">Live</a>
  <a href="/history" class="{{ 'active' if active=='history' else '' }}">History</a>
</nav>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
